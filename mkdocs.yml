site_name: Clinic Forecasting Platform
site_description: Documentation for the clinic forecasting, uncertainty and staffing decision-support portfolio project.
site_url: https://diogoribeiro7.github.io/clinic-forecasting-platform/
repo_url: https://github.com/DiogoRibeiro7/clinic-forecasting-platform
repo_name: DiogoRibeiro7/clinic-forecasting-platform
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Demo:
      - 10-minute walkthrough: demo_guide.md
      - Notebook guide: notebook_guide.md
  - Scientific method:
      - Evaluation strategy: evaluation_strategy.md
      - Hybrid policy: hybrid_policy.md
      - Horizon policy uncertainty: horizon_policy_uncertainty_design.md
      - Hybrid robustness design: hybrid_capacity_robustness_design.md
      - Latent-demand design: latent_demand_design.md
      - Clinical staffing optimiser: clinical_staffing_optimizer_design.md
      - NHS GPAD external validity: real_data_external_validity_design.md
      - NHS GPAD panel policy: nhs_gpad_panel_policy.md
  - Architecture and serving:
      - Architecture: architecture.md
      - API v2 contract: api_v2_contract.md
      - Serving contract v2: serving_contract_v2.md
      - Serving promotion: serving_promotion.md
  - Operations and governance:
      - Production readiness: production_readiness.md
      - Operational risk: operational_risk.md
      - Development plan: development_plan.md
      - Releasing: releasing.md
