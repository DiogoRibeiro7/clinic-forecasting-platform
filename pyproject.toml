[tool.poetry]
name = "clinic-forecasting-platform"
version = "0.1.0"
description = "A PoC forecasting platform for clinic usage and staffing optimisation in healthcare networks."
authors = ["Portfolio Project"]
readme = "README.md"
packages = [{ include = "clinic_forecast", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
numpy = "^1.26.4"
pandas = "^2.2.2"
scikit-learn = "^1.5.1"
statsmodels = "^0.14.2"
matplotlib = "^3.9.1"
pyyaml = "^6.0.2"
fastapi = "^0.115.0"
uvicorn = "^0.30.0"
pydantic = "^2.8.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
pytest-cov = "^5.0.0"
ruff = "^0.5.5"
mypy = "^1.11.1"
jupyterlab = "^4.2.4"
nbstripout = "^0.7.1"
types-pyyaml = "^6.0.12.20260518"
httpx = "^0.28.1"

[tool.poetry.group.optional]
optional = true

[tool.poetry.group.optional.dependencies]
prophet = "^1.1.5"
xgboost = "^2.1.1"
torch = "^2.4.0"
nixtla = "^0.6.0"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
