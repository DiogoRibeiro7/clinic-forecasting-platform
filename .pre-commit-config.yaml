repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: poetry run ruff check
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff format check
        entry: poetry run ruff format --check
        language: system
        types: [python]

      - id: mypy
        name: Mypy
        entry: poetry run mypy src
        language: system
        pass_filenames: false
        types: [python]
