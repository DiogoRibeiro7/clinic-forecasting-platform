name: Temporary DataExcept lock refresh

on:
  push:
    branches:
      - feat/use-dataexcept
    paths:
      - pyproject.toml
      - .github/workflows/tmp-dataexcept-lock.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/use-dataexcept

      - name: Install Poetry 2.4.2
        run: pipx install poetry==2.4.2

      - name: Refresh lock
        run: poetry lock

      - name: Commit lock
        run: |
          if git diff --quiet -- poetry.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poetry.lock
          git commit -m "Refresh lock for DataExcept"
          git push origin HEAD:feat/use-dataexcept
