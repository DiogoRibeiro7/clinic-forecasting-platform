name: Link check

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "mkdocs.yml"
      - ".github/workflows/link-check.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "mkdocs.yml"
      - ".github/workflows/link-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Validate documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          version: "v0.24.2"
          args: >-
            --no-progress
            --exclude-mail
            --accept 200,206,429
            "**/*.md"
