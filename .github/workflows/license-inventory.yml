name: License inventory

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "poetry.lock"
      - ".github/workflows/license-inventory.yml"
  pull_request:
    paths:
      - "pyproject.toml"
      - "poetry.lock"
      - ".github/workflows/license-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    name: Generate dependency license inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: poetry

      - name: Install main dependencies
        run: poetry install --only main --no-interaction

      - name: Install pip-licenses
        run: poetry run python -m pip install "pip-licenses==5.5.5"

      - name: Generate license inventory
        run: |
          mkdir -p reports/licenses
          poetry run pip-licenses             --format=json             --with-urls             --with-description             --output-file reports/licenses/dependencies.json
          poetry run pip-licenses             --format=markdown             --with-urls             --with-description             --output-file reports/licenses/dependencies.md

      - name: Upload license inventory
        uses: actions/upload-artifact@v4
        with:
          name: dependency-licenses-${{ github.sha }}
          path: reports/licenses/
          if-no-files-found: error
