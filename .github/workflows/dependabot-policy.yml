name: Dependabot policy

on:
  pull_request:
    paths:
      - ".github/dependabot.yml"
  push:
    branches:
      - main
    paths:
      - ".github/dependabot.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DiogoRibeiro7/safe-dependabot@v1
