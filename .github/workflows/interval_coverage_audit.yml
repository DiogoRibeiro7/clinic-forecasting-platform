name: Conformal interval coverage audit

on:
  push:
    branches:
      - main
    paths:
      - src/clinic_forecast/interval_coverage_audit.py
      - src/clinic_forecast/intervals.py
      - src/clinic_forecast/backtesting.py
      - src/clinic_forecast/core_benchmark.py
      - src/clinic_forecast/models/global_ml.py
      - scripts/run_interval_coverage_audit.py
      - scripts/generate_data.py
      - pyproject.toml
      - poetry.lock
      - .github/workflows/interval_coverage_audit.yml
  pull_request:
    paths:
      - src/clinic_forecast/interval_coverage_audit.py
      - src/clinic_forecast/intervals.py
      - src/clinic_forecast/backtesting.py
      - src/clinic_forecast/core_benchmark.py
      - src/clinic_forecast/models/global_ml.py
      - scripts/run_interval_coverage_audit.py
      - scripts/generate_data.py
      - pyproject.toml
      - poetry.lock
      - .github/workflows/interval_coverage_audit.yml
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry==2.4.2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Generate frozen synthetic data
        run: poetry run python scripts/generate_data.py --seed 42

      - name: Run prequential interval coverage audit
        run: poetry run python scripts/run_interval_coverage_audit.py

      - name: Record provenance
        run: |
          {
            echo "commit_sha=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "python=$(python --version 2>&1)"
            echo "poetry=$(poetry --version)"
          } > reports/outputs/interval_coverage_audit/provenance.txt
          poetry export --format requirements.txt --without-hashes > reports/outputs/interval_coverage_audit/requirements.txt

      - name: Upload coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: interval-coverage-audit-${{ github.sha }}
          path: reports/outputs/interval_coverage_audit/
